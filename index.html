<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connections Coordinator</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const dark  = saved
        ? saved === 'dark'
        : matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.dataset.theme = 'dark';
    })();
  </script>
</head>
<body>

<div id="app">

  <!-- ── Header ─────────────────────────────────────────────────────── -->
  <header class="app-header">
    <div>
      <div class="app-title">Connections Coordinator</div>
      <div class="app-sub">
        Assistant for NY Times Connections. <br> Drag tiles to rearrange. Color to form groups.
      </div>
    </div>
    <button id="theme-toggle" onclick="toggleTheme()">Dark</button>
  </header>

  <!-- ── Setup / input ──────────────────────────────────────────────── -->
  <section id="setup" class="panel">
    <div class="panel-content">
      <textarea
        id="tiles-input"
        placeholder="Enter the 16 tiles (one per line or comma-separated)&#10;&#10;e.g. FIRST, COLLEGE, BEST ..."
      ></textarea>
      <div class="btn-row">
        <button class="btn-primary"   onclick="loadBoard()">Load board</button>
        <button class="btn-secondary" onclick="loadSample()">Load sample puzzle</button>
        <span id="err"></span>
      </div>
    </div>
  </section>

  <!-- ── Board ──────────────────────────────────────────────────────── -->
  <section id="board-section" class="panel">
    <div class="panel-content">

    <!-- Color picker (rendered by app.js#buildSwatches) -->
    <div id="color-bar" class="color-bar"></div>

    <p class="hint">Select a color, then click tiles to paint. Click tiles with the same color to unpaint.</p>

    <div class="divider"></div>

    <!-- Tile grid -->
    <div id="grid"></div>

    <div class="divider"></div>

    <!-- Controls -->
    <div class="btn-row">
      <button class="btn-secondary" onclick="sortByColor()">Sort by color</button>
      <button class="btn-secondary" onclick="shuffleAll()">Shuffle all</button>
      <button class="btn-secondary" onclick="shuffleUncolored()">Shuffle uncolored</button>
    </div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="clearColors()">Clear colors</button>
      <button class="btn-secondary" onclick="resetBoard()">New puzzle</button>
    </div>

    </div>
  </section>

  <!-- ── Footer ─────────────────────────────────────────────────────── -->
  <footer>
    This is an unofficial brainstorming tool and is not affiliated with The New York Times.
  </footer>

</div><!-- /#app -->

<!-- data.js must load before app.js (provides COLOR_STYLES, COLOR_ORDER, SAMPLE_TILES) -->
<script src="data.js"  defer></script>
<script src="app.js"   defer></script>

</body>
</html>
